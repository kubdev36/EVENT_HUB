services:
  db:
    image: postgres:16-alpine
    container_name: event_hub_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: event_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./event_hub_be
      dockerfile: Dockerfile
      target: dev
    container_name: event_hub_be
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: event_hub
      jwt_token: dev_event_hub_jwt_secret
      INIT_ADMIN_EMAIL: admin@minhtuanmobile.com
      INIT_ADMIN_PASSWORD: "123456"
      telegram_bot_token: ""
      telegram_chat_id: ""
    ports:
      - "3000:3000"
    volumes:
      - ./event_hub_be:/app
      - backend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/docs').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: ./EVENT_HUB_FE
      dockerfile: Dockerfile
      target: dev
    container_name: event_hub_fe
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      - ./EVENT_HUB_FE:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:
