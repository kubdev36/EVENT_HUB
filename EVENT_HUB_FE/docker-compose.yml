version: '3.8'

services:
  # Development Environment (with Hot Module Replacement)
  web-dev:
    build:
      context: .
      target: dev
    container_name: event_hub_fe_dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

  # Production Environment (Optimized Nginx server serving static assets)
  web-prod:
    build:
      context: .
      target: prod
    container_name: event_hub_fe_prod
    ports:
      - "8080:80"
    environment:
      - NODE_ENV=production
