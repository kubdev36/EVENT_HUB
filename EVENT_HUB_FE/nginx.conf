# Frontend là SPA dùng React Router: đường dẫn không phải file tĩnh (vd. /reports) trả index.html.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # File build có hash trong tên: cache dài hạn.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
